<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300" role="img" aria-labelledby="t d">
<title id="t">Word formats</title>
<desc id="d">A 32-bit big-endian word read as a two's-complement integer, as Q30 fixed point (sign, one integer bit, 30 fraction bits), as two 16-bit lanes, and as the int16 sample pairs the hardware writes.</desc>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.4; }
  .hot { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
  .warm { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
  .dmp3 { fill: #ffffff; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .ln { stroke: #1f2328; stroke-width: 1.4; fill: none; }
  .lnd { stroke: #1f2328; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  .mk { fill: #1f2328; }
  .t { font: 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .tb { font: 600 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
  .s { font: 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
  .p { font: 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8250df; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #e6edf3; }
    .hot { fill: #0c2d6b; stroke: #4493f8; }
    .warm { fill: #3d2e00; stroke: #d29922; }
    .dmp3 { fill: #0d1117; stroke: #ab7df8; }
    .ln, .lnd { stroke: #e6edf3; }
    .mk { fill: #e6edf3; }
    .t, .tb, .m { fill: #e6edf3; }
    .s { fill: #9198a1; }
    .p { fill: #ab7df8; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="mk" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="740" height="300"/>
<text class="m" x="149.0" y="30" text-anchor="middle">31</text>
<text class="m" x="419.0" y="30" text-anchor="middle">16</text>
<text class="m" x="437.0" y="30" text-anchor="middle">15</text>
<text class="m" x="707.0" y="30" text-anchor="middle">0</text>
<text class="tb" x="128" y="64" text-anchor="end">integer</text>
<rect class="hot" x="140" y="44" width="18" height="30" rx="2"/>
<text class="t" x="149.0" y="64" text-anchor="middle">s</text>
<rect class="box" x="158" y="44" width="558" height="30" rx="2"/>
<text class="t" x="437.0" y="64" text-anchor="middle">two's complement, −2³¹ … 2³¹ − 1</text>
<text class="tb" x="128" y="110" text-anchor="end">Q30</text>
<rect class="hot" x="140" y="90" width="18" height="30" rx="2"/>
<text class="t" x="149.0" y="110" text-anchor="middle">s</text>
<rect class="warm" x="158" y="90" width="18" height="30" rx="2"/>
<text class="t" x="167.0" y="110" text-anchor="middle">i</text>
<rect class="box" x="176" y="90" width="540" height="30" rx="2"/>
<text class="t" x="446.0" y="110" text-anchor="middle">value = word / 2³⁰: from −2.0 to just under +2.0</text>
<text class="tb" x="128" y="156" text-anchor="end">lanes</text>
<rect class="box" x="140" y="136" width="288" height="30" rx="2"/>
<text class="t" x="284.0" y="156" text-anchor="middle">high lane (f2, f6)</text>
<rect class="box" x="428" y="136" width="288" height="30" rx="2"/>
<text class="t" x="572.0" y="156" text-anchor="middle">low lane (f3, f7)</text>
<text class="tb" x="128" y="202" text-anchor="end">MPU samples</text>
<rect class="warm" x="140" y="182" width="288" height="30" rx="2"/>
<text class="t" x="284.0" y="202" text-anchor="middle">ax · az · gx · gz</text>
<rect class="warm" x="428" y="182" width="288" height="30" rx="2"/>
<text class="t" x="572.0" y="202" text-anchor="middle">ay · temp · gy · —</text>
<text class="tb" x="128" y="248" text-anchor="end">ICM samples</text>
<rect class="warm" x="140" y="228" width="288" height="30" rx="2"/>
<text class="t" x="284.0" y="248" text-anchor="middle">0 · ax · az · gy · temp</text>
<rect class="warm" x="428" y="228" width="288" height="30" rx="2"/>
<text class="t" x="572.0" y="248" text-anchor="middle">0 · ay · gx · gz · —</text>
<text class="s" x="140" y="290" text-anchor="start">Samples: int16 pairs. MPU: words 0–3 at 0x000. ICM: words 0–4 at 0x0000, word 0 cleared.</text>
</svg>
