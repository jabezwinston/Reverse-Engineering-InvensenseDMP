<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="t d">
<title id="t">ICM-20948 DMP memory map</title>
<desc id="d">16 KB of DMP memory, 0x0000 to 0x3FFF. The sample page at the bottom is rewritten every tick; pointers reach the 4 KB data window 0x0000 to 0x0FFF; code runs from anywhere below 0x3000, by default from 0x1000; 0x3000 to 0x3FFF is the FIFO, a 4 KB ring. In mode 4 a page load addresses the host register file instead (inset).</desc>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.4; }
  .hot { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
  .warm { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
  .dmp3 { fill: #ffffff; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .ln { stroke: #1f2328; stroke-width: 1.4; fill: none; }
  .lnd { stroke: #1f2328; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  .mk { fill: #1f2328; }
  .t { font: 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .tb { font: 600 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
  .s { font: 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
  .p { font: 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8250df; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #e6edf3; }
    .hot { fill: #0c2d6b; stroke: #4493f8; }
    .warm { fill: #3d2e00; stroke: #d29922; }
    .dmp3 { fill: #0d1117; stroke: #ab7df8; }
    .ln, .lnd { stroke: #e6edf3; }
    .mk { fill: #e6edf3; }
    .t, .tb, .m { fill: #e6edf3; }
    .s { fill: #9198a1; }
    .p { fill: #ab7df8; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="mk" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="760" height="430"/>
<rect class="hot" x="250" y="30.0" width="150" height="95.0" rx="4"/>
<rect class="box" x="250" y="125.0" width="150" height="190.0" rx="4"/>
<rect class="warm" x="250" y="315.0" width="150" height="95.0" rx="4"/>
<rect class="warm" x="250" y="30.0" width="150" height="14" rx="4"/>
<text class="s" x="325.0" y="41.0" text-anchor="middle">sample page</text>
<text class="tb" x="325.0" y="77.5" text-anchor="middle">data window</text>
<text class="s" x="325.0" y="95.5" text-anchor="middle">blocks 0–3</text>
<text class="tb" x="325.0" y="220.0" text-anchor="middle">code</text>
<text class="s" x="325.0" y="238.0" text-anchor="middle">default entry 0x1000</text>
<text class="tb" x="325.0" y="362.5" text-anchor="middle">FIFO</text>
<text class="s" x="325.0" y="380.5" text-anchor="middle">4 KB ring</text>
<text class="m" x="240" y="34.0" text-anchor="end">0x0000</text>
<text class="m" x="240" y="129.0" text-anchor="end">0x1000</text>
<text class="m" x="240" y="319.0" text-anchor="end">0x3000</text>
<text class="m" x="240" y="413.976806640625" text-anchor="end">0x3FFF</text>
<line class="lnd" x1="400" y1="37.0" x2="424" y2="37.0"/>
<text class="s" x="430" y="41.0" text-anchor="start">0x0000–0x0003 cleared, 0x0004–0x0011 samples, every tick</text>
<line class="lnd" x1="400" y1="50.96875" x2="424" y2="50.96875"/>
<text class="s" x="430" y="54.96875" text-anchor="start">0x0080–0x0087: written by a device reset</text>
<line class="lnd" x1="400" y1="87.5" x2="424" y2="87.5"/>
<text class="s" x="430" y="91.5" text-anchor="start">every pointer reaches 0x0000–0x0FFF</text>
<line class="lnd" x1="400" y1="220.0" x2="424" y2="220.0"/>
<text class="s" x="430" y="224.0" text-anchor="start">code may also sit below 0x1000</text>
<line class="lnd" x1="400" y1="362.5" x2="424" y2="362.5"/>
<text class="s" x="430" y="366.5" text-anchor="start">every FIFO byte lands here; newest kept</text>
<rect class="dmp3" x="16" y="160" width="160" height="104" rx="4"/>
<text class="tb" x="96" y="182" text-anchor="middle">I/O space (mode 4)</text>
<text class="s" x="96" y="202" text-anchor="middle">a page load in mode 4</text>
<text class="s" x="96" y="217" text-anchor="middle">reaches host registers:</text>
<text class="s" x="96" y="232" text-anchor="middle">word a = register a/4</text>
<text class="s" x="96" y="247" text-anchor="middle">blocks 0–1 = banks 0–3</text>
</svg>
