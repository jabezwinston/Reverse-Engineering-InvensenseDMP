<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="t d">
<title id="t">How an operand address is formed</title>
<desc id="d">A pointer holds a block, a bank and a page; the word within the page comes from the ALU byte for the two operands and from P2's walked word index for the destination.</desc>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #f6f8fa; stroke: #1f2328; stroke-width: 1.4; }
  .hot { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
  .warm { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.4; }
  .dmp3 { fill: #ffffff; stroke: #8250df; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .ln { stroke: #1f2328; stroke-width: 1.4; fill: none; }
  .lnd { stroke: #1f2328; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  .mk { fill: #1f2328; }
  .t { font: 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .tb { font: 600 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .m { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
  .s { font: 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
  .p { font: 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8250df; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #e6edf3; }
    .hot { fill: #0c2d6b; stroke: #4493f8; }
    .warm { fill: #3d2e00; stroke: #d29922; }
    .dmp3 { fill: #0d1117; stroke: #ab7df8; }
    .ln, .lnd { stroke: #e6edf3; }
    .mk { fill: #e6edf3; }
    .t, .tb, .m { fill: #e6edf3; }
    .s { fill: #9198a1; }
    .p { fill: #ab7df8; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path class="mk" d="M0,0 L10,5 L0,10 z"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="760" height="280"/>
<rect class="hot" x="60" y="60" width="104" height="44" rx="4"/>
<text class="tb" x="112.0" y="87" text-anchor="middle">block</text>
<text class="m" x="112.0" y="50" text-anchor="middle">11–10</text>
<text class="s" x="112.0" y="124" text-anchor="middle">p0blk p1blk p2blk</text>
<rect class="hot" x="164" y="60" width="104" height="44" rx="4"/>
<text class="tb" x="216.0" y="87" text-anchor="middle">bank</text>
<text class="m" x="216.0" y="50" text-anchor="middle">9–8</text>
<text class="s" x="216.0" y="124" text-anchor="middle">p0bank n …</text>
<rect class="hot" x="268" y="60" width="208" height="44" rx="4"/>
<text class="tb" x="372.0" y="87" text-anchor="middle">page</text>
<text class="m" x="372.0" y="50" text-anchor="middle">7–4</text>
<text class="s" x="372.0" y="124" text-anchor="middle">p0page n …</text>
<rect class="hot" x="476" y="60" width="104" height="44" rx="4"/>
<text class="tb" x="528.0" y="87" text-anchor="middle">word</text>
<text class="m" x="528.0" y="50" text-anchor="middle">3–2</text>
<text class="s" x="528.0" y="124" text-anchor="middle">A, B field · P2.w</text>
<rect class="box" x="580" y="60" width="104" height="44" rx="4"/>
<text class="tb" x="632.0" y="87" text-anchor="middle">byte</text>
<text class="m" x="632.0" y="50" text-anchor="middle">1–0</text>
<text class="s" x="632.0" y="124" text-anchor="middle">0</text>
<text class="t" x="16" y="30" text-anchor="start">A pointer's address, 12 bits (MPU-6050: block 0–2, 0x000–0xBFF; ICM-20948: block 0–3, 0x0000–0x0FFF)</text>
<text class="tb" x="60" y="170" text-anchor="start">operand A</text>
<text class="m" x="200" y="170" text-anchor="start">M[ P0 + 4·a ]</text>
<text class="s" x="360" y="170" text-anchor="start">a = bits 6–5 of the ALU byte</text>
<text class="tb" x="60" y="204" text-anchor="start">operand B</text>
<text class="m" x="200" y="204" text-anchor="start">M[ P1 + 4·b ]</text>
<text class="s" x="360" y="204" text-anchor="start">b = bits 4–3 of the ALU byte</text>
<text class="tb" x="60" y="238" text-anchor="start">destination</text>
<text class="m" x="200" y="238" text-anchor="start">M[ P2 + 4·w ]</text>
<text class="s" x="360" y="238" text-anchor="start">w = P2's word index: p2page sets 0; adv, .next, p2inc2 walk it</text>
</svg>
