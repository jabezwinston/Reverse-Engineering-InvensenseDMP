<!-- Included by the Midnight theme's layout. Styles the sidebar that
     .github/scripts/prep_manual.py adds to each page. -->
<style>
  #sidebar {
    font-size: 13px; line-height: 1.5;
    background: #1e1e1e; border: 1px solid #333; border-radius: 4px;
    padding: 12px 16px; margin: 0 0 24px;
  }
  #sidebar ul { margin: 0; padding-left: 0; list-style: none; }
  #sidebar > ul > li { margin: 4px 0; }
  #sidebar ul ul { padding-left: 14px; margin: 4px 0 8px; border-left: 1px solid #333; }
  #sidebar ul ul li { margin: 2px 0; }
  #sidebar ul ul ul { margin: 2px 0; }
  #sidebar p { margin: 0 0 8px; }
  #sidebar a { color: #a9c9e6; text-decoration: none; }
  #sidebar a:hover { color: #fff; text-decoration: underline; }
